# =================================
# SEARCH SERVICE DEPLOYMENT
# =================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: textmesh
  labels:
    app: textmesh
    component: search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: textmesh
      component: search-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: textmesh
        component: search-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3008"
    spec:
      serviceAccountName: textmesh-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: search-service
          image: textmesh/search-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3008
              protocol: TCP
          envFrom:
            - configMapRef:
                name: textmesh-config
            - secretRef:
                name: textmesh-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
