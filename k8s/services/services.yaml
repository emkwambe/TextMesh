# =================================
# TEXTMESH KUBERNETES SERVICES
# =================================

---
# API Gateway Service (LoadBalancer for external access)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: textmesh
  labels:
    app: textmesh
    component: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: textmesh
    component: api-gateway

---
