# =================================
# TEXTMESH DEPENDABOT CONFIGURATION
# =================================

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jest"
          - "@jest/*"
      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "prettier"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker
  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/post-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/feed-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/group-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/notification-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/moderation-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/search-service"
    schedule:
      interval: "weekly"
