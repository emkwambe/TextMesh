# Alertmanager Configuration for TextMesh
# Production-ready alert routing and notification

global:
  # The smarthost and SMTP sender used for mail notifications.
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@textmesh.com'
  smtp_auth_username: 'alerts@textmesh.com'
  smtp_auth_password_file: '/etc/alertmanager/secrets/smtp_password'
  smtp_require_tls: true

  # Slack API URL for notifications
  slack_api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'

  # PagerDuty integration key
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

  # Resolution timeout
  resolve_timeout: 5m

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  # Default receiver
  receiver: 'platform-slack'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # How long to wait before sending a notification
  group_wait: 30s

  # How long to wait before sending notification about new alerts
  group_interval: 5m

  # How long to wait before re-sending a notification
  repeat_interval: 4h

  # Child routes for specific alerts
  routes:
    # Critical alerts - PagerDuty + Slack
    - match:
        severity: critical
      receiver: 'critical-pagerduty'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - match:
        severity: critical
      receiver: 'critical-slack'
      group_wait: 10s

    # Database team alerts
    - match:
        team: database
      receiver: 'database-slack'
      group_by: ['alertname', 'instance']

    # Search team alerts
    - match:
        team: search
      receiver: 'search-slack'

    # Security alerts
    - match:
        team: security
      receiver: 'security-pagerduty'
      group_wait: 10s
      repeat_interval: 30m

    # Trust & Safety alerts
    - match:
        team: trust-safety
      receiver: 'trust-safety-slack'

    # Growth team alerts (non-urgent)
    - match:
        team: growth
      receiver: 'growth-slack'
      repeat_interval: 12h

    # Infrastructure alerts
    - match:
        team: infrastructure
      receiver: 'infrastructure-slack'

    # Warning alerts - Slack only
    - match:
        severity: warning
      receiver: 'platform-slack'
      repeat_interval: 6h

# Inhibition rules
inhibit_rules:
  # If a critical alert is firing, inhibit warnings for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # If service is down, inhibit all other alerts for that service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['job']

# Receivers - notification configurations
receivers:
  # Platform team Slack channel
  - name: 'platform-slack'
    slack_configs:
      - channel: '#platform-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'
        actions:
          - type: button
            text: 'Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
          - type: button
            text: 'Dashboard'
            url: 'https://grafana.textmesh.com/d/textmesh-overview'

  # Critical alerts - PagerDuty
  - name: 'critical-pagerduty'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/secrets/pagerduty_service_key'
        severity: critical
        description: '{{ template "pagerduty.description" . }}'
        client: 'TextMesh Alertmanager'
        client_url: 'https://alertmanager.textmesh.com'
        details:
          firing: '{{ template "pagerduty.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.instances" .Alerts.Resolved }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'

  # Critical alerts - Slack
  - name: 'critical-slack'
    slack_configs:
      - channel: '#critical-alerts'
        send_resolved: true
        title: ':rotating_light: CRITICAL: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.text" . }}'
        color: 'danger'

  # Database team Slack
  - name: 'database-slack'
    slack_configs:
      - channel: '#database-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  # Search team Slack
  - name: 'search-slack'
    slack_configs:
      - channel: '#search-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  # Security team PagerDuty
  - name: 'security-pagerduty'
    pagerduty_configs:
      - service_key_file: '/etc/alertmanager/secrets/pagerduty_security_key'
        severity: critical
        description: 'SECURITY: {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: ':lock: Security Alert'
        text: '{{ template "slack.text" . }}'
        color: 'danger'

  # Trust & Safety Slack
  - name: 'trust-safety-slack'
    slack_configs:
      - channel: '#trust-safety-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  # Growth team Slack
  - name: 'growth-slack'
    slack_configs:
      - channel: '#growth-alerts'
        send_resolved: true
        title: ':chart_with_upwards_trend: {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.text" . }}'
        color: 'good'

  # Infrastructure Slack
  - name: 'infrastructure-slack'
    slack_configs:
      - channel: '#infrastructure-alerts'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'
        color: '{{ template "slack.color" . }}'

  # Null receiver for silenced alerts
  - name: 'null'
